<!doctype html>
<!-- Dev only: view an OBJ mesh (e.g. Object Capture output).
     /debug/mesh.html?src=/objcap/x/baked_mesh.obj[&mtl=/objcap/x/baked_mesh.mtl][&az=30][&el=20][&wire=1][&notex=1][&clip=x0,x1,y0,y1,z0,z1 (mesh units; frames on the clipped box)] -->
<meta charset="utf-8"><title>mesh check</title>
<style>html,body{margin:0;height:100%;background:#1b1b1f;color:#ddd;font:13px sans-serif}#info{position:absolute;left:8px;top:8px;background:#000a;padding:4px 8px;white-space:pre}</style>
<div id="info">loading…</div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const src = q.get('src'); let mtl = q.get('mtl');
if (!mtl && src && !q.has('notex')) mtl = src.replace(/\.obj$/i, '.mtl');
const az = +(q.get('az') ?? 30) * Math.PI / 180, el = +(q.get('el') ?? 20) * Math.PI / 180;
const info = document.getElementById('info');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b1b1f);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(1, 2, 1.5); scene.add(dl);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
function render() { renderer.render(scene, camera); }
controls.addEventListener('change', render);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); render(); });
async function load() {
  const loader = new OBJLoader();
  if (mtl) {
    try {
      const m = await new MTLLoader().setPath(mtl.slice(0, mtl.lastIndexOf('/') + 1)).loadAsync(mtl.slice(mtl.lastIndexOf('/') + 1));
      m.preload(); loader.setMaterials(m);
    } catch (e) { console.warn('no mtl', e); }
  }
  const obj = await loader.loadAsync(src);
  let verts = 0, tris = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry; verts += g.attributes.position.count; tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(mm => { mm.side = THREE.DoubleSide; if (mm.map) mm.map.colorSpace = THREE.SRGBColorSpace; if (q.has('wire')) mm.wireframe = true; if (q.has('notex')) { mm.map = null; mm.color?.set(0xbbbbbb); } mm.needsUpdate = true; });
    if (!mats[0].map && !q.has('notex')) g.computeVertexNormals();
  });
  scene.add(obj);
  let box = new THREE.Box3().setFromObject(obj);
  if (q.get('clip')) {
    const [x0, x1, y0, y1, z0, z1] = q.get('clip').split(',').map(Number);
    renderer.localClippingEnabled = true;
    const planes = [new THREE.Plane(new THREE.Vector3(1,0,0), -x0), new THREE.Plane(new THREE.Vector3(-1,0,0), x1), new THREE.Plane(new THREE.Vector3(0,1,0), -y0), new THREE.Plane(new THREE.Vector3(0,-1,0), y1), new THREE.Plane(new THREE.Vector3(0,0,1), -z0), new THREE.Plane(new THREE.Vector3(0,0,-1), z1)];
    obj.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(mm => { mm.clippingPlanes = planes; }); });
    box = new THREE.Box3(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
  }
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = size.length() / 2, d = r / Math.sin(camera.fov * Math.PI / 360) * 0.9;
  camera.position.set(c.x + d * Math.cos(el) * Math.sin(az), c.y + d * Math.sin(el), c.z + d * Math.cos(el) * Math.cos(az));
  camera.near = d / 100; camera.far = d * 10; camera.updateProjectionMatrix();
  controls.target.copy(c); controls.update();
  // wait for textures
  await new Promise(res => setTimeout(res, 50));
  const pend = []; obj.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(mm => { if (mm.map && !mm.map.image) pend.push(new Promise(r2 => { const t = setInterval(() => { if (mm.map.image) { clearInterval(t); r2(); } }, 50); })); }); });
  await Promise.race([Promise.all(pend), new Promise(r2 => setTimeout(r2, 15000))]);
  render();
  info.textContent = `${src}\nverts ${verts}  tris ${Math.round(tris)}\nbbox ${size.toArray().map(v => v.toFixed(2)).join(' x ')}  az ${q.get('az') ?? 30}° el ${q.get('el') ?? 20}°`;
  window.__ready = true;
}
load().catch(e => { info.textContent = 'error: ' + e; window.__ready = true; });
</script>
