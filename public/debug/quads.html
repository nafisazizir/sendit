<!doctype html>
<meta charset="utf-8"><title>quad check</title>
<style>body{background:#111;color:#ddd;font:13px sans-serif;margin:0;padding:8px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}figure{margin:0;position:relative}img{width:100%;display:block}svg{position:absolute;inset:0;width:100%;height:100%}figcaption{position:absolute;left:4px;top:4px;background:#000a;padding:2px 6px}</style>
<p>Dev only: each anchor photo with its <code>geometry.quad</code> (yellow) or <code>crop</code> (cyan). Data from <code>/src/data/jawa.json</code>.</p>
<div class="g" id="g"></div>
<script>
fetch('/src/data/jawa.json').then(r=>r.json()).then(d=>{
  const set=d.sets[0];
  for(const f of d.faces){
    const ph=set.photos.find(p=>p.faceId===f.id&&p.role==='anchor'); if(!ph) continue;
    const g=f.geometry||{}; let pts, col='cyan';
    if(g.quad){pts=g.quad;col='yellow'} else {const [x,y,w,h]=g.crop||[0,0,1,1];pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
    const fig=document.createElement('figure');
    fig.innerHTML=`<img src="${ph.src}"><svg viewBox="0 0 ${ph.width} ${ph.height}" preserveAspectRatio="none"><polygon points="${pts.map(p=>p[0]*ph.width+','+p[1]*ph.height).join(' ')}" fill="${col}" fill-opacity="0.12" stroke="${col}" stroke-width="6"/></svg><figcaption>${f.id} · ${g.source||'estimate'} · lean ${g.lean}° · ${g.from?Math.hypot(g.to[0]-g.from[0],g.to[1]-g.from[1]).toFixed(2)+' m':''}</figcaption>`;
    document.getElementById('g').appendChild(fig);
  }
});
</script>
